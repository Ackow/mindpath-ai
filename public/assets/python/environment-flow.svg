<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="200">
  <rect width="600" height="200" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <!-- System Python -->
  <g transform="translate(40, 40)">
    <rect width="140" height="120" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="70" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">系统 Python</text>
    <text x="70" y="70" font-family="sans-serif" font-size="12" fill="#64748B" text-anchor="middle">v3.11 全局环境</text>
  </g>
  <!-- Arrow -->
  <path d="M 190 100 L 240 100" stroke="#0D9488" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <!-- Venv 1 -->
  <g transform="translate(250, 40)">
    <rect width="140" height="120" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="70" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#065F46" text-anchor="middle">虚拟环境 A</text>
    <text x="70" y="70" font-family="sans-serif" font-size="12" fill="#047857" text-anchor="middle">PyTorch 2.1</text>
  </g>
  <!-- Venv 2 -->
  <g transform="translate(420, 40)">
    <rect width="140" height="120" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="70" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">虚拟环境 B</text>
    <text x="70" y="70" font-family="sans-serif" font-size="12" fill="#1D4ED8" text-anchor="middle">scikit-learn 1.4</text>
  </g>
</svg>
